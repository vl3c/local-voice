<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>local-voice</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #dddad3; --sunk: #efede8;
    --accent: #b3261e; --accent-ink: #fff; --ok: #1f7a3a; --warn: #a15c00;
    --tip-bg: #1d1d1f; --tip-ink: #f6f5f2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0f11; --panel: #18181b; --ink: #ececef; --muted: #9a9aa2; --line: #2b2b30; --sunk: #121215;
            --accent: #e5483d; --accent-ink: #fff; --ok: #46b06a; --warn: #e0a040;
            --tip-bg: #ececef; --tip-ink: #18181b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: .02em; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 4px;
          text-transform: uppercase; letter-spacing: .05em; }
  label:first-child { margin-top: 0; }
  textarea, input, select { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
          border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  input:disabled { opacity: .45; }
  textarea { resize: vertical; }
  #text { min-height: 84px; }
  #instruction { min-height: 64px; font-size: 14px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; align-items: end; }
  .row label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .checks { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; font-size: 14px; }
  .checks label { display: inline-flex; gap: 6px; align-items: center; text-transform: none;
                  letter-spacing: 0; font-weight: 400; color: var(--ink); margin: 0; }
  .checks input { width: auto; }
  .actions { display: flex; gap: 10px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; border-radius: 6px; padding: 8px 16px; cursor: pointer;
           border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: progress; }
  #status { color: var(--muted); font-size: 13px; }
  #status button.undo { padding: 2px 10px; font-size: 13px; margin-left: 6px; }
  #saveSettings, #resetSettings { font-size: 13px; padding: 6px 12px; }
  .take { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 14px; }
  .take .meta { font-size: 12px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
  .take .said { margin: 6px 0 10px; }
  .take audio { width: 100%; margin: 4px 0; }
  .take .lbl { font-size: 12px; color: var(--muted); }
  .take .heard { font-size: 13px; margin-top: 6px; }
  .good { color: var(--ok); } .bad { color: var(--warn); }
  .take img { width: 100%; border-radius: 6px; margin-top: 8px; }
  .take .dl { font-size: 12px; margin-left: 8px; }
  .take .dl a { color: var(--muted); margin-right: 8px; }
  .take .warn { font-size: 13px; color: var(--warn); margin-top: 6px; }
  .fxbox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px;
           background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; }
  .fxbox .boxlbl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .fxbox .boxlbl.head { min-width: 58px; }
  .panel .fxbox { margin-top: 12px; }
  details.tune { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--sunk); }
  details.tune summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted);
                         text-transform: uppercase; letter-spacing: .05em; }
  details.tune summary span { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 8px; }
  details.tune .row { margin-top: 10px; }
  details.tune input { background: var(--panel); }
  .take .actions { margin-top: 12px; gap: 8px; }
  .take .actions button { font-size: 13px; padding: 6px 12px; }
  #tip { position: fixed; z-index: 10; max-width: 340px; padding: 8px 10px; border-radius: 6px;
         background: var(--tip-bg); color: var(--tip-ink); font-size: 13px; line-height: 1.4;
         pointer-events: none; opacity: 0; transition: opacity .12s; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  #tip.on { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>local-voice</h1>
  <p class="sub">Voice-design TTS + machine-voice effects, on this machine only. Hover over anything for 1 s to see what it does.</p>

  <div class="panel">
    <label for="text" data-tip="The line to speak. English vocal events work inline: (sigh), (laugh), (clears throat). Ctrl+Enter speaks.">Text</label>
    <textarea id="text" data-tip="The line to speak. English vocal events work inline: (sigh), (laugh), (clears throat). Ctrl+Enter speaks.">Your civilization is a flicker in the dark. We are the dark, and we have always been here.</textarea>

    <div class="row">
      <div data-tip="Which TTS model speaks. English uses Breeze TTS 2, which builds a voice from a written description. Romanian uses OmniVoice, which speaks as the chosen voice (see Romanian voice) or designs one from fixed attributes.">
        <label for="lang">Language</label>
        <select id="lang">
          <option value="en">English</option>
          <option value="ro">Romanian</option>
        </select>
      </div>
      <div data-tip="Who speaks: a built-in voice, each a description and a seed picked by ear (choosing one also sets the seed under Fine-tuning). Independent of the effects: any voice works with any preset. Editing the description below switches this to 'Your own description'.">
        <label for="voice">Voice</label>
        <select id="voice"></select>
      </div>
      <div data-tip="The sound-design chain applied to the voice. Machines: reaper-drone (one unmoving brass pitch speaks the words), reaper (the same, loosely following intonation), harbinger (a synth chord stepping in semitones), sovereign, demon (organic and monstrous). Creatures: synthetic-ai (a ship's AI), ai-choir (an AI choir, stereo), wraith (a ghost), hive (a crowd as one), droid (a small robot). dry: no effects.">
        <label for="preset">Effects</label>
        <select id="preset"></select>
      </div>
      <div data-tip="Space added after everything else. None keeps the voice clean and close (best if you'll add your own room later). Light: a large room. Medium: a concert hall. Heavy: a cathedral.">
        <label for="reverb">Reverb</label>
        <select id="reverb"><option value="none">None</option><option value="room" selected>Light (large room)</option><option value="hall">Medium (hall)</option><option value="cathedral">Heavy (cathedral)</option></select>
      </div>
      <div id="roVoiceBox" data-tip="Romanian only: which voice speaks the Romanian. Clone: the chosen voice's own English take, cloned: its depth and delivery, with a little English accent. Native: a Romanian voice designed for it by the Romanian engine (seeded): a native accent, but higher and smaller. Recommended: each voice's better one (native for the young woman, the clone for the rest).">
        <label for="roVoice">Romanian voice</label>
        <select id="roVoice"><option value="auto">Recommended</option><option value="clone">Clone (English voice)</option><option value="native">Native (Romanian engine)</option></select>
      </div>
    </div>
    <div id="presetDesc" class="hint"></div>

    <label for="instruction" id="instructionLbl">Voice and mood</label>
    <textarea id="instruction"></textarea>
    <div id="instructionHint" class="hint"></div>

    <details class="tune" id="tune">
      <summary data-tip="The finer controls. The heading lists any that differ from their defaults.">Fine-tuning<span id="tuneSummary"></span></summary>
      <div class="row">
        <div data-tip="Semitones, -12 to +12, applied to the finished sound. Negative is lower and bigger: the machine's tone and the size of its throat move down together. -3 to -5 is a good start.">
          <label for="pitch">Pitch</label>
          <input id="pitch" type="number" value="0" min="-12" max="12" step="1">
        </div>
        <div data-tip="Time-stretch, 0.5-1.5: below 1 is slower, without changing pitch. Applied to the voice before the effects.">
          <label for="tempo">Tempo</label>
          <input id="tempo" type="number" value="1" min="0.5" max="1.5" step="0.05">
        </div>
        <div data-tip="Mix the human voice under the effect, 0-1: 0 is all effect, 0.5 half and half (equal loudness), 1 all human. The two are sample-aligned, so they speak as one.">
          <label for="blend">Blend</label>
          <input id="blend" type="number" value="0" min="0" max="1" step="0.05">
        </div>
        <div data-tip="Bass under 150 Hz, -12 to +6 dB: negative is less. When a take warns that the words sit low under the bass, -6 usually clears them up.">
          <label for="bass">Bass (dB)</label>
          <input id="bass" type="number" value="0" min="-12" max="6" step="1">
        </div>
        <div data-tip="Blank for a random voice. A number reproduces a take exactly; choosing a voice sets its own. The base voice varies a lot by seed, so rerolling is the main way to find a good one.">
          <label for="seed">Seed</label>
          <input id="seed" value="74525861" placeholder="random">
        </div>
        <div id="cfgBox" data-tip="English only: how strictly the model follows the voice description. Default 6 (Breeze recommends 4): stronger pushes the voice harder towards the description; much above 6 can sound forced. Range 0.5-10.">
          <label for="cfg">Strength</label>
          <input id="cfg" type="number" value="6" min="0.5" max="10" step="0.5">
        </div>
        <div id="speedBox" data-tip="Romanian only: the model's own speaking rate, 0.75-1.3 (default 0.9). Below about 0.75 it starts repeating words, so for slower speech use Tempo.">
          <label for="speed">Speed</label>
          <input id="speed" type="number" value="0.9" min="0.75" max="1.3" step="0.05">
        </div>
        <div data-tip="With Blend: let the effect trail the human voice by this many milliseconds, 0-60 (default 0, exactly together). 10-30 thickens the two into one doubled voice, which can read as extra reverb.">
          <label for="double">Double (ms)</label>
          <input id="double" type="number" value="0" min="0" max="60" step="5">
        </div>
      </div>
    </details>

    <div class="checks">
      <label data-tip="After generating, Whisper transcribes both the raw and the processed audio and shows what share of your words it heard (a check that the effects didn't bury the speech), plus a spectrogram. Adds about a second."><input type="checkbox" id="check" checked> Transcribe + spectrogram</label>
      <label data-tip="While ticked, every new line clones the voice of this take (set with 'Clone voice for next lines' on a take), so a whole scene sounds like one speaker, in English or Romanian. The voice description is then only used to steer the delivery (English) or ignored (Romanian). Untick to design voices from the description again."><input type="checkbox" id="useLike" disabled> Clone voice of take <span id="likeId">-</span></label>
    </div>

    <div class="actions">
      <button class="primary" id="go" data-tip="Generate the take: about 5-10 s for a sentence or two in English, about 1-2 s in Romanian. The first take after a start also loads the model; the very first Romanian line also makes the default voice (about 30 s).">Speak</button>
      <span id="status"></span>
    </div>
    <div class="fxbox" data-tip="Your own default settings, kept on this machine (config.local.json). The page starts with them and agents use them for anything they don't specify.">
      <span class="boxlbl head">My defaults</span>
      <button id="saveSettings" data-tip="Save the panel's current settings (language, voice or your own English description, effects, reverb, Romanian voice, fine-tuning and the check box) as your defaults. The page starts with them, and agents use them for anything they don't specify. Stored on this machine in config.local.json, separate from the built-in defaults, which stay untouched. Asks before saving.">Save as my defaults</button>
      <button id="resetSettings" data-tip="Forget your saved defaults and go back to the built-in ones (the ancient male voice, reaper-drone, light room). Asks first. Doesn't touch the stored Romanian voices.">Reset to built-in</button>
    </div>
  </div>

  <div id="takes"></div>
</main>
<div id="tip" role="tooltip"></div>

<script>
const $ = (id) => document.getElementById(id);
let presets = {};
let voices = {};  // the built-in voices (/api/voices)
let likeTake = null;
const CUSTOM = "custom";
const chosenVoice = () => ($("voice").value === CUSTOM ? null : $("voice").value);

// ------------------------------------------------------------------ tooltips
// Native title tooltips can't be delayed, so: any element with data-tip shows
// its text after 1 s of hover (or keyboard focus), and hides on leave or click.
const TIP_DELAY = 1000;
let tipTimer = null;
function tipFor(target) { const t = target.closest && target.closest("[data-tip]"); return t; }
function showTip(t) {
  const tip = $("tip");
  tip.textContent = t.dataset.tip;
  const r = t.getBoundingClientRect();
  tip.style.left = "0px"; tip.style.top = "0px"; tip.classList.add("on");
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 8);
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
function hideTip() { clearTimeout(tipTimer); tipTimer = null; $("tip").classList.remove("on"); }
let tipTarget = null;
document.addEventListener("mouseover", (e) => {
  const t = tipFor(e.target);
  if (t === tipTarget) return;
  hideTip(); tipTarget = t;
  if (t) tipTimer = setTimeout(() => showTip(t), TIP_DELAY);
});
document.addEventListener("focusin", (e) => {
  const t = tipFor(e.target);
  hideTip(); tipTarget = t;
  if (t) tipTimer = setTimeout(() => showTip(t), TIP_DELAY);
});
document.addEventListener("mousedown", hideTip);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); });
window.addEventListener("scroll", hideTip, true);

// ------------------------------------------------------------------ helpers
function setBusy(on, msg) {
  $("go").disabled = on;
  document.querySelectorAll(".rerun").forEach(b => b.disabled = on);
  $("status").textContent = msg || "";
}

async function api(path, body, method) {
  const r = await fetch(path, method ? {method} : body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail ? (typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail)) : r.statusText);
  return j;
}

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "tip") e.dataset.tip = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) e.append(c);
  return e;
}

// ------------------------------------------------------------------ language + description
const isRo = () => $("lang").value !== "en";
const stockDescriptions = () => Object.values(voices).map(v => v.instruction);
let defaultVoice = null;

const TIP_DESC_EN = "Free-text description the model builds the voice from: size, age, timbre, pitch, pace, emotion, attitude. The machine timbre comes from the preset, but pacing, pauses and emphasis come from here. Deeper and slower works best with the Reaper presets.";
const TIP_DESC_RO = "Leave empty to speak as the chosen voice (see Romanian voice). Or design a one-off voice from fixed attributes, comma-separated, one per group: gender (male, female), age (child, teenager, young adult, middle-aged, elderly), pitch (very low pitch ... very high pitch), style (whisper). Ignored while 'Clone voice of take' is ticked.";

// Which stored take this voice's Romanian lines clone, for the Romanian voice setting.
const roKind = () => ($("roVoice").value !== "auto" ? $("roVoice").value
  : (voices[chosenVoice() || "ancient-male"]?.romanian?.use || "clone"));

const TUNE = [["pitch", 0, "pitch"], ["tempo", 1, "tempo"], ["blend", 0, "blend"], ["bass", 0, "bass"],
              ["double", 0, "double"], ["cfg", 6, "strength"], ["speed", 0.9, "speed"]];
function syncTune() {
  const parts = TUNE.filter(([id, d]) => !$(id).disabled && $(id).value !== "" && parseFloat($(id).value) !== d)
    .map(([id, , name]) => `${name} ${$(id).value}`);
  const v = voices[chosenVoice()];
  const seed = $("seed").value.trim();
  if (!seed) parts.push("random seed");
  else if (!v || String(v.seed) !== seed) parts.push(`seed ${seed}`);
  $("tuneSummary").textContent = parts.length ? "· " + parts.join(" · ") : "· all at their defaults";
}

function syncLanguage() {
  const ro = isRo();
  $("cfg").disabled = ro; $("speed").disabled = !ro;
  $("cfgBox").style.display = ro ? "none" : ""; $("speedBox").style.display = ro ? "" : "none";
  $("roVoiceBox").style.display = ro ? "" : "none";
  syncTune();
  $("instructionLbl").textContent = ro ? "Voice attributes (optional)" : "Voice and mood";
  $("instructionLbl").dataset.tip = $("instruction").dataset.tip = ro ? TIP_DESC_RO : TIP_DESC_EN;
  $("instruction").placeholder = ro ? "empty = the chosen voice · or e.g. male, elderly, very low pitch" : "";
  syncVoiceHint();
  // Swap in the right kind of default unless the user wrote their own.
  const cur = $("instruction").value.trim();
  if (ro && stockDescriptions().includes(cur)) $("instruction").value = "";
  if (!ro && !cur) $("instruction").value = voices[$("voice").value]?.instruction || "";
  $("text").setAttribute("lang", ro ? "ro" : "en");
}

function syncVoiceHint() {
  const v = voices[$("voice").value];
  const who = v ? v.name : "the default voice";
  const kind = roKind() === "native" ? "its native Romanian voice" : "a clone of its English voice";
  $("instructionHint").textContent = !isRo() ? (v ? v.about || "" : "Your own description.") : defaultVoice
    ? `Empty = ${who}, as ${kind} (take ${defaultVoice.id}, ${defaultVoice.f0_hz} Hz). "Set as Romanian voice" on a take replaces it.${defaultVoice.previous ? ` (Previous: take ${defaultVoice.previous.id}.)` : ""}`
    : `Empty = ${who}, as ${kind}: made automatically on the first Romanian line.`;
}

async function setDefaultVoice(res) {
  // An English take becomes the voice's clone source; a Romanian one, its native voice.
  // The Romanian voice setting itself is left alone: it decides which of the two is used.
  const id = res.id, kind = res.language === "ro" ? "native" : "clone";
  const voice = chosenVoice() || "ancient-male", name = voices[voice]?.name || voice;
  const label = kind === "native" ? "native Romanian voice" : "Romanian clone (from English)";
  let cur = null;
  try { const h = await api(`/api/default-voice?voice=${encodeURIComponent(voice)}&kind=${kind}`); cur = h.id ? h : null; } catch (e) {}
  if (cur && cur.id === id) { $("status").textContent = `Take ${id} already is the ${name}'s ${label}.`; return; }
  const which = kind === "native" ? "the native voice" : "the clone";
  const now = roKind() === kind ? `This page's setting picks ${which} now.` : `This page's setting picks the other one now.`;
  if (!confirm(`Make take ${id} the ${name}'s ${label}?\n\nRomanian lines with this voice use it whenever the Romanian ` +
      `voice setting picks ${which} (agents follow your saved setting; Recommended picks ${voices[voice]?.romanian?.use === "native" ? "the native voice" : "the clone"} ` +
      `for this voice). ${now}\n\nCurrent: ${cur ? `take ${cur.id} (${cur.f0_hz} Hz)` : "none yet"}. ` +
      `It is remembered, so you can switch back.`)) return;
  try {
    const set = await api("/api/default-voice", {id, voice, kind});
    if (roKind() === kind) defaultVoice = set;
    syncVoiceHint();
    $("status").textContent = `The ${name}'s ${label} is now take ${id} (${set.f0_hz} Hz). `;
    if (cur) $("status").append(el("button", {class: "undo", onclick: () => restorePreviousVoice(voice, kind),
      tip: `Switch back to take ${cur.id}.`}, "Undo"));
  } catch (e) { $("status").textContent = "Error: " + e.message; }
}

async function restorePreviousVoice(voice, kind) {
  try {
    const back = await api("/api/default-voice/restore-previous", {voice, kind});
    if (roKind() === kind && (chosenVoice() || "ancient-male") === voice) defaultVoice = back;
    syncVoiceHint();
    $("status").textContent = `Back to take ${back.id} (${back.f0_hz} Hz).`;
  } catch (e) { $("status").textContent = "Error: " + e.message; }
}

async function loadDefaultVoice() {
  try {
    const h = await api("/api/default-voice?voice=" + encodeURIComponent(chosenVoice() || "ancient-male") + "&kind=" + roKind());
    defaultVoice = h.id ? h : null;
  } catch (e) { defaultVoice = null; }
  syncVoiceHint();
}

// ------------------------------------------------------------------ saved settings
let settings = null;  // {effective, saved, repo, file} from the server

function applySettings(eff, saved = {}) {
  $("lang").value = eff.language || "en";
  if (presets[eff.preset]) $("preset").value = eff.preset;
  $("voice").value = eff.instruction ? CUSTOM : (voices[eff.voice] ? eff.voice : "ancient-male");
  // A built-in voice brings its own seed, unless the user saved one.
  const seed = "seed" in saved || !voices[chosenVoice()] ? eff.seed : voices[chosenVoice()].seed;
  $("seed").value = seed === null || seed === undefined ? "" : seed;
  $("cfg").value = eff.cfg_scale; $("speed").value = eff.speed;
  $("pitch").value = eff.pitch; $("tempo").value = eff.tempo;
  $("blend").value = eff.blend ?? 0; $("double").value = eff.double_ms ?? 0; $("bass").value = eff.bass_db ?? 0;
  $("reverb").value = eff.reverb; $("check").checked = !!eff.check; $("roVoice").value = eff.ro_voice || "auto";
  $("instruction").value = eff.instruction || voices[$("voice").value]?.instruction || "";
  showPreset();
  syncLanguage();
  syncTune();
}

function collectSettings() {
  const seed = $("seed").value.trim();
  const desc = $("instruction").value.trim();
  const custom = !isRo() && desc && !chosenVoice();
  const c = {
    language: $("lang").value, voice: chosenVoice() || "ancient-male", preset: $("preset").value,
    seed: seed ? parseInt(seed, 10) : null,
    cfg_scale: parseFloat($("cfg").value), speed: parseFloat($("speed").value),
    pitch: parseFloat($("pitch").value), tempo: parseFloat($("tempo").value),
    blend: parseFloat($("blend").value), double_ms: parseFloat($("double").value), bass_db: parseFloat($("bass").value),
    reverb: $("reverb").value, ro_voice: $("roVoice").value, check: $("check").checked, instruction: custom ? desc : null,
  };
  // A cleared number field is left out (it keeps the default), never saved as empty.
  for (const k of ["cfg_scale", "speed", "pitch", "tempo", "blend", "double_ms", "bass_db"]) if (!Number.isFinite(c[k])) delete c[k];
  if (seed && !Number.isFinite(c.seed)) c.seed = null;
  return c;
}

function describeSettings(c) {
  const names = {room: "light (large room)", hall: "medium (hall)", cathedral: "heavy (cathedral)", none: "none"};
  return [`Language: ${c.language === "ro" ? "Romanian" : "English"}`,
    `Voice: ${c.instruction ? "your own description (\"" + c.instruction.slice(0, 60) + (c.instruction.length > 60 ? "…" : "") + "\")" : (voices[c.voice]?.name || c.voice)}`,
    `Effects: ${c.preset}`, `Romanian voice: ${{auto: "recommended", clone: "clone (English voice)", native: "native"}[c.ro_voice] || c.ro_voice}`,
    `Seed: ${c.seed === null ? "random each time" : c.seed}`, `Strength: ${c.cfg_scale ?? "default"}`, `Speed (Romanian): ${c.speed ?? "default"}`,
    `Pitch: ${c.pitch ?? "default"}`, `Tempo: ${c.tempo ?? "default"}`,
    `Blend (human share): ${c.blend ?? "default"}`, `Double: ${c.double_ms ?? "default"} ms`, `Bass: ${c.bass_db ?? "default"} dB`, `Reverb: ${names[c.reverb] || c.reverb}`,
    `Transcribe + spectrogram: ${c.check ? "on" : "off"}`].join("\n");
}

$("saveSettings").addEventListener("click", async () => {
  const c = collectSettings();
  if (!confirm("Save these as your defaults?\n\n" + describeSettings(c) +
      "\n\nThe page will start with them, and agents will use them for anything they don't specify. " +
      "This replaces any defaults you saved before. The built-in defaults stay as they are " +
      "(\"Reset to built-in\" goes back to them).")) return;
  try {
    settings = await api("/api/settings", c);
    $("status").textContent = "Saved as your defaults (config.local.json).";
  } catch (e) { $("status").textContent = "Error: " + e.message; }
});

$("resetSettings").addEventListener("click", async () => {
  if (!settings || !settings.file) { $("status").textContent = "You have no saved defaults: the built-in ones are in use."; return; }
  if (!confirm("Forget your saved defaults and go back to the built-in ones?\n\n" + describeSettings(settings.repo) +
      "\n\nThe default voice is not affected.")) return;
  try {
    settings = await api("/api/settings", null, "DELETE");
    applySettings(settings.effective, settings.saved);
    $("status").textContent = "Back to the built-in defaults.";
  } catch (e) { $("status").textContent = "Error: " + e.message; }
});

function showPreset() {
  $("presetDesc").textContent = (presets[$("preset").value] || {}).description || "";
}

$("lang").addEventListener("change", () => { syncLanguage(); loadDefaultVoice(); });
$("roVoice").addEventListener("change", loadDefaultVoice);
$("tune").addEventListener("input", syncTune);
$("tune").addEventListener("toggle", () => { try { localStorage.setItem("tuneOpen", $("tune").open ? "1" : ""); } catch (e) {} });
$("preset").addEventListener("change", showPreset);  // effects never change who speaks
$("voice").addEventListener("change", () => {
  const v = voices[$("voice").value];
  if (v) {
    // English: the voice's description. Romanian: no attributes, so the voice is cloned.
    $("instruction").value = isRo() ? "" : v.instruction;
    $("seed").value = v.seed;
  }
  syncTune();
  syncVoiceHint();
  loadDefaultVoice();
});
$("instruction").addEventListener("input", () => {
  const v = voices[$("voice").value];
  if (!isRo() && v && $("instruction").value.trim() !== v.instruction) { $("voice").value = CUSTOM; syncVoiceHint(); }
});

// ------------------------------------------------------------------ takes
function audio(name) { return el("audio", {controls: "", preload: "auto", src: "/files/" + encodeURIComponent(name)}); }

function renderTake(res, autoplay) {
  const box = el("div", {class: "take"});
  const lang = res.language || "en";
  box.append(el("div", {class: "meta", tip: "Take id · language · seed · preset · length · generation time. The id is what --like and --fx take on the command line."},
    `${res.id} · ${lang} · seed ${res.seed} · ${res.preset}${res.pitch ? ` · pitch ${res.pitch > 0 ? "+" : ""}${res.pitch}` : ""}${res.tempo && res.tempo !== 1 ? ` · tempo ${res.tempo}` : ""}${res.blend ? ` · blend ${res.blend}${res.double_ms ? ` double ${res.double_ms} ms` : ""}` : ""}${res.bass_db ? ` · bass ${res.bass_db > 0 ? "+" : ""}${res.bass_db} dB` : ""}${res.trim_end_s ? " · tail cut" : ""}${res.reverb && res.reverb !== "none" ? ` · ${res.reverb}` : ""} · ${res.duration_s}s · gen ${res.gen_s ?? "-"}s`));
  box.append(el("div", {class: "said"}, res.text));
  if (voices[res.voice] && res.language === "en") box.append(el("div", {class: "meta", tip: "The built-in voice: " + voices[res.voice].instruction}, "voice: " + voices[res.voice].name));
  else if (res.instruction) box.append(el("div", {class: "meta", tip: "The voice description used for this take."}, "voice: " + res.instruction));
  else if (res.default_voice) box.append(el("div", {class: "meta", tip: "This Romanian take spoke as a built-in voice: a clone of its stored English take, or its native Romanian voice (the Romanian voice setting)."},
    "voice: " + (voices[res.voice]?.name || "default voice") + ({native: ", native Romanian", clone: ", cloned from English"}[res.ro_voice] || "") + " (take " + res.like + ")"));
  else if (res.like) box.append(el("div", {class: "meta", tip: "This take reused the voice of an earlier take."}, "voice of take " + res.like));

  const dl = el("span", {class: "dl"},
    el("a", {href: "/files/" + encodeURIComponent(res.files.wet), download: res.files.wet, tip: "Download the processed audio as WAV (lossless, 48 kHz)."}, "WAV"),
    res.files.mp3 ? el("a", {href: "/files/" + encodeURIComponent(res.files.mp3), download: res.files.mp3, tip: "Download as MP3: what WhatsApp and most messengers accept."}, "MP3") : null,
    res.files.voice ? el("a", {href: "/files/" + encodeURIComponent(res.files.voice), download: res.files.voice, tip: "Download the human voice under the effects as WAV: sample-aligned with the processed audio, with the same pitch, tempo, reverb, length and loudness. Lay it under the processed track in an edit to mix machine and human."}, "voice WAV") : null,
    res.files.words ? el("a", {href: "/files/" + encodeURIComponent(res.files.words), download: res.files.words, tip: "Word timings as JSON: when each word of the script starts and ends in the processed audio, in seconds (approximate where Whisper misheard or missed it), plus phrases. For cueing animation to the words."}, "words") : null,
    res.files.srt ? el("a", {href: "/files/" + encodeURIComponent(res.files.srt), download: res.files.srt, tip: "Subtitles (SRT), one cue per phrase, timed to the processed audio: import into an editor as a track to see the words on the timeline."}, "SRT") : null);
  box.append(el("div", {class: "lbl", tip: "The final audio with the preset applied (48 kHz). Plays automatically when the take arrives."}, "processed", dl));
  for (const w of (res.warnings || [])) box.append(el("div", {class: "warn"}, "⚠ " + w));
  if (res.sentences && res.sentences.some(x => x.tries > 1)) {
    const fixed = res.sentences.filter(x => x.tries > 1).length;
    box.append(el("div", {class: "meta", tip: "Romanian is generated a sentence at a time, and each sentence is checked with Whisper. A sentence with missing words is regenerated on a new seed, up to 3 tries, keeping the best."},
      `${fixed} of ${res.sentences.length} sentence(s) were regenerated to recover missing words`));
  }
  const wet = audio(res.files.wet); box.append(wet);
  if (res.files.dry) {
    box.append(el("div", {class: "lbl", tip: "The model's raw output before effects (24 kHz): judge the base voice here. Is it deep and slow enough, and are the words right?"}, "dry voice"));
    box.append(audio(res.files.dry));
  }
  if (res.heard) {
    for (const k of ["wet", "dry"]) {
      const m = res.match[k];
      const loop = (res.asr_unreliable || []).includes(k);
      box.append(el("div", {class: "heard", tip: "What Whisper heard. Green: 85% or more of your words. Amber: fewer, so the effects may be burying the speech or the model fluffed a word. 'Whisper looped' means the transcript is unreliable: listen instead."},
        el("span", {class: (m >= 0.85 && !loop) ? "good" : "bad"}, `${k}: ${Math.round(m * 100)}% of words heard${loop ? " (Whisper looped: unreliable)" : ""}`), " — ", res.heard[k]));
    }
  }
  if (res.check_error) box.append(el("div", {class: "warn"}, "Transcription check failed (the take itself is fine): " + res.check_error));
  if (res.files.spectrogram) box.append(el("img", {src: "/files/" + encodeURIComponent(res.files.spectrogram), alt: "spectrogram",
    tip: "Waveform and spectrogram of the processed audio: energy over time and frequency. Speech shows formant bands and gaps between words."}));

  // Re-running takes the panel's effects (preset, reverb and fine-tuning): change them there,
  // or "Load settings" first to start from this take's.
  const rerunWith = async (extra, busy) => {
    setBusy(true, busy);
    try {
      renderTake(await api("/api/fx", {id: res.id, ...panelEffects(), check: $("check").checked, ...extra}), true);
      setBusy(false);
    } catch (e) { setBusy(false, "Error: " + e.message); }
  };
  // Stray sound after the last word (an "mmm", a breath): cut it, or undo a cut. The take remembers.
  const strayTail = (res.warnings || []).some(w => w.includes("after the last word"));
  const loadSettings = () => {
    $("text").value = res.text; $("seed").value = res.seed;
    if (presets[res.preset]) { $("preset").value = res.preset; showPreset(); }
    $("voice").value = voices[res.voice] ? res.voice : (res.instruction ? CUSTOM : "ancient-male");
    $("lang").value = ["en", "ro"].includes(lang) ? lang : "en"; syncLanguage();
    $("instruction").value = res.instruction || "";
    if (res.speed) $("speed").value = res.speed;
    $("pitch").value = res.pitch ?? 0; $("tempo").value = res.tempo ?? 1; $("reverb").value = res.reverb || "none";
    $("blend").value = res.blend ?? 0; $("double").value = res.double_ms ?? 0; $("bass").value = res.bass_db ?? 0;
    if (res.cfg_scale) $("cfg").value = res.cfg_scale;
    syncTune(); syncVoiceHint(); loadDefaultVoice();
  };
  box.append(el("div", {class: "actions"},
    el("button", {class: "rerun", tip: "Apply the panel's effects (preset, reverb and fine-tuning) to this same performance in a second or two, without regenerating. Adds a new card, so you can compare. To start from this take's own settings, press Load settings first.",
      onclick: () => rerunWith({}, "Re-applying effects…")}, "Re-run effects"),
    res.trim_end_s
      ? el("button", {class: "rerun", tip: "This take is cut just after its last word. Undo the cut (re-runs with the panel's effects).",
          onclick: () => rerunWith({trim_tail: false}, "Undoing the tail cut…")}, "Undo tail cut")
      : strayTail ? el("button", {class: "rerun", tip: "Cut the stray sound after the last word, in the gap before it (re-runs with the panel's effects). The take remembers the cut; the dry recording itself is untouched.",
          onclick: () => rerunWith({trim_tail: true}, "Cutting the stray tail…")}, "Cut stray tail") : null,
    el("button", {tip: "Copy this take's text, language, voice, effects and fine-tuning into the panel above, to tweak one thing and regenerate or re-run. Doesn't change your saved defaults.",
      onclick: loadSettings}, "Load settings"),
    el("button", {tip: "Every new line clones this take's voice (same depth, rasp and pacing), in English or Romanian, while 'Clone voice of take' above is ticked: for a scene that sounds like one speaker.",
      onclick: () => { likeTake = res.id; $("likeId").textContent = res.id; $("useLike").disabled = false; $("useLike").checked = true; }}, "Clone voice for next lines"),
    el("button", {tip: "Make this take what Romanian lines with the voice selected above clone (when the attributes are left empty): an English take as its clone, a Romanian one as its native voice. The one it replaces is kept, so you can undo.",
      onclick: () => setDefaultVoice(res)}, "Set as Romanian voice")));

  $("takes").prepend(box);
  if (autoplay) wet.play().catch(() => {});
}

function panelEffects() {
  return {preset: $("preset").value, reverb: $("reverb").value,
          pitch: parseFloat($("pitch").value) || 0, tempo: parseFloat($("tempo").value) || 1,
          blend: parseFloat($("blend").value) || 0, double_ms: parseFloat($("double").value) || 0,
          bass_db: parseFloat($("bass").value) || 0};
}

$("go").addEventListener("click", async () => {
  const text = $("text").value.trim();
  if (!text) { $("status").textContent = "Write something to say."; return; }
  const seed = $("seed").value.trim();
  const body = {
    text, voice: chosenVoice(), instruction: isRo() || !chosenVoice() ? $("instruction").value : null,
    language: $("lang").value, ...panelEffects(),
    seed: seed ? parseInt(seed, 10) : null, like: $("useLike").checked ? likeTake : null, check: $("check").checked,
  };
  // Keeping a voice with the stock description would steer away from it: send none, for a pure clone.
  if (body.like && body.instruction !== null && stockDescriptions().includes(body.instruction.trim())) body.instruction = null;
  if (isRo()) {
    body.speed = parseFloat($("speed").value) || 0.9; body.ro_voice = $("roVoice").value;
    if (body.instruction !== null && !body.instruction.trim()) body.instruction = null;
  }
  else body.cfg_scale = parseFloat($("cfg").value) || 6;
  setBusy(true, "Speaking… (the first take after a start also loads the model)");
  const t0 = performance.now();
  try {
    const res = await api("/api/speak", body);
    renderTake(res, true);
    if (res.default_voice && !defaultVoice) await loadDefaultVoice();
    setBusy(false, `Done in ${((performance.now() - t0) / 1000).toFixed(1)}s`);
  }
  catch (e) { setBusy(false, "Error: " + e.message); }
});

$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.ctrlKey) $("go").click(); });

(async () => {
  try {
    presets = await api("/api/presets");
    for (const k of Object.keys(presets)) $("preset").append(el("option", {value: k}, k));
    voices = await api("/api/voices");
    for (const [k, v] of Object.entries(voices)) $("voice").append(el("option", {value: k}, v.name));
    $("voice").append(el("option", {value: CUSTOM}, "Your own description"));
    settings = await api("/api/settings");
    applySettings(settings.effective, settings.saved);
    try { $("tune").open = localStorage.getItem("tuneOpen") === "1"; } catch (e) {}
    await loadDefaultVoice();
  } catch (e) { $("status").textContent = "Server not reachable: " + e.message; }
})();
</script>
</body>
</html>
