name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # Cancel superseded runs on PR updates only; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The whole suite runs without a GPU or model weights: the models are faked
  # (tests/test_server.py), so this checks the server, effects, word timings, CLI,
  # scripts and the page contract. The job name is the required status check.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install (CPU torch, no models)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci.txt
      - name: pytest
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Pre-publish safety scan (files and history)
        run: |
          git fetch --unshallow --quiet || true
          python scripts/check_repo_safe.py --history
